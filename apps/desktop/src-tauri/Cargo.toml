[package]
name = "kairo-desktop"
version = "0.1.0"
description = "KAIRO Native Floating Screen Overlay & HUD"
authors = ["KAIRO Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1.1"
tokio = { version = "1.37", features = ["full"] }
